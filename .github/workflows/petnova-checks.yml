name: PetNova checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, petnova-pet-care-features]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Test account and data helpers
        working-directory: backend
        run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: |
          test -f frontend/js/app.js
          node --check frontend/js/app.js

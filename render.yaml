services:
  - type: web
    name: vetgpt-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: backend
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: OPENAI_COMPATIBLE_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_COMPATIBLE_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false   # set this secret manually in the Render dashboard
      - key: PETNOVA_AUTH_SECRET
        generateValue: true # Render generates a private signing secret
      - key: PETNOVA_DB_PATH
        value: /tmp/petnova.sqlite3  # Ephemeral on Render Free; use persistent storage for production
      - key: ALLOWED_ORIGINS
        value: "https://vetgpt-ai-hxcr.vercel.app"
